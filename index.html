<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会計ファイナンス学科 面接セルフ練習（志望理由書版）</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 面接ルーム：白地・大学ごとのテーマ色。主役は「面接官の吹き出し」と「声に反応するマイクボタン」 */
:root{
  --bg:#ffffff; --surface:#f2f3f7; --line:#e2e4eb; --ink:#161a26; --muted:#6b7185;
  --accent:#5a2d82; --accent-ink:#ffffff; --soft:#efe8f6; --rec:#ef4359; --rec-soft:#fde8eb; --gold:#f5a524; --ok:#1f9d6b;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
/* 上のバー */
.bar{padding:18px 0 10px}
.bar .home{display:inline-block;font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none;margin-bottom:6px}
.bar .eyebrow{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.bar h1{font-family:var(--round);font-weight:900;font-size:22px;line-height:1.35;margin:2px 0 0;letter-spacing:.01em}
/* 下のタブ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .dot{background:var(--accent)}
.tabbar .dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
body.running .tabbar,body.running .bar{display:none}
body.running .app{padding-top:14px}
/* 共通 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);font-family:var(--round)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.huge{font-size:19px;padding:16px 28px;width:100%}
.small{font-size:13px;color:var(--muted)}
.warn{color:var(--rec)}
.alert{background:var(--rec-soft);color:#9b1c2e;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6}
h2.sec{font-family:var(--round);font-weight:700;font-size:15px;color:var(--muted);margin:26px 0 10px}
kbd{font:inherit;font-size:12px;border:1.5px solid currentColor;border-radius:5px;padding:0 6px;opacity:.85}
@media (hover:none){kbd{display:none}}
/* ホーム */
.count{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--accent);color:#fff;border-radius:28px;padding:20px 22px 18px;position:relative;overflow:hidden}
.count .lbl{font-size:14px;font-weight:700;opacity:.85}
.count .big{font-family:var(--round);font-weight:900;font-size:64px;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;margin-top:4px}
.count .big small{font-size:20px;font-weight:700}
.count .sub{font-size:13px;opacity:.85;margin-top:6px}
.count .deco{position:absolute;right:-18px;bottom:-26px;width:150px;height:150px;opacity:.16}
.count.unset{background:var(--surface);color:var(--ink)}
.count.unset .big{font-size:22px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 12px 10px}
.stat b{display:block;font-family:var(--round);font-weight:900;font-size:26px;line-height:1.1}
.stat b small{font-size:13px;font-weight:700;margin-left:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat.fire b{color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:12px 8px 10px;cursor:pointer;text-align:center}
.chip b{display:block;font-family:var(--round);font-weight:900;font-size:22px;line-height:1.1}
.chip span{display:block;font-size:12.5px;color:var(--muted)}
.chip em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chip[aria-pressed="true"] em{color:var(--accent)}
.selnote{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.toggles{display:flex;flex-direction:column;margin-top:10px;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-size:15px;padding:12px 14px;background:#fff}
.sw+.sw{border-top:1px solid var(--line)}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:21px}
.prep{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.pbtn .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.pbtn .ic svg{width:20px;height:20px}
.pbtn b{display:block;font-size:14.5px;line-height:1.3}
.pbtn span{font-size:12px;color:var(--muted)}
.pbtn.ok{border-color:var(--ok)}
.pbtn.ok .ic{background:var(--ok);color:#fff}
.check{margin-top:10px;background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14px}
.check audio{width:100%;margin-top:8px}
.meter2{height:10px;border-radius:5px;background:#fff;overflow:hidden;margin-top:8px}
.meter2 i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.meter2 i.lo{background:var(--line)}
.cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:22px;z-index:5}
.cta .btn.huge{box-shadow:0 8px 24px -10px var(--accent)}
.resume{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:13.5px}
.namecard{display:flex;flex-direction:column;gap:8px;margin-top:16px;background:var(--soft);border:2px solid var(--accent);border-radius:20px;padding:16px 18px}
.namecard.done{background:var(--surface);border-color:var(--line)}
.namecard .nl{display:flex;flex-direction:column;gap:1px}
.namecard .nl b{font-family:var(--round);font-size:16px}
.namecard .nl span{font-size:12.5px;color:var(--muted)}
.namecard input{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;width:100%;font-size:16px}
.namecard input:focus-visible{border-color:var(--accent)}
details.more{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;font-size:15px}
.notice{margin-top:14px;font-size:12.5px;color:var(--muted)}
/* 面接中 */
.run{display:flex;flex-direction:column;min-height:calc(100svh - 120px)}
.rtop{display:flex;align-items:center;gap:10px;padding-top:4px}
.rtop .x{border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:8px;flex:1;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--accent);opacity:.4}
.rtop .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rtop .meta.warn{color:var(--rec);font-weight:700}
.stage{display:flex;gap:12px;align-items:flex-start;margin-top:22px}
.av{width:58px;height:58px;flex:none;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.av svg{width:50px;height:50px}
.av .mouth{transform-origin:25px 33px;transition:transform .1s}
.stage.talk .av .mouth{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.6)}}
.bubble{flex:1;background:var(--surface);border-radius:4px 24px 24px 24px;padding:14px 16px 16px}
.qtag{font-family:var(--round);font-weight:700;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:6px}
.qtag .num{font-weight:900;font-size:18px}
.qtag.follow{color:#b5610b}
.qtext{font-family:var(--round);font-weight:700;font-size:21px;line-height:1.55;margin:4px 0 0;text-wrap:pretty}
.who{font-size:12.5px;color:var(--muted);margin:8px 0 0 70px;min-height:1.5em}
.micwrap{margin-top:auto;padding:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.mic{--lv:0;position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;font-family:var(--round);font-weight:900;font-size:15px;line-height:1.3;text-align:center;transition:background .2s,transform .1s}
.mic:active{transform:scale(.97)}
.mic svg{width:40px;height:40px;display:block;margin:0 auto 2px}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.mic::before{background:var(--rec);opacity:0;transform:scale(1);transition:transform .09s linear,opacity .2s}
.mic.rec{background:var(--rec)}
.mic.rec::before{opacity:.22;transform:scale(calc(1.06 + var(--lv)*.55))}
.mic.rec::after{border:3px solid var(--rec);opacity:.35;transform:scale(calc(1.02 + var(--lv)*.3))}
.mic.wait{background:var(--line);color:var(--muted);cursor:default}
.mic.ready{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 0%,transparent)}}
.timer{font-family:var(--round);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer.over{color:var(--rec)}
.zone{width:100%;max-width:320px}
.zbar{height:10px;border-radius:5px;background:var(--surface);position:relative;overflow:hidden}
.zbar .ok{position:absolute;top:0;bottom:0;left:25%;width:25%;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.zbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:5px}
.zbar.over i{background:var(--rec)}
.zlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.hint{font-size:13.5px;color:var(--muted);text-align:center;min-height:1.6em}
.rbtns{display:flex;justify-content:center;gap:8px;margin-top:6px}
/* おわり */
.done h2{font-family:var(--round);font-weight:900;font-size:28px;line-height:1.3;margin:6px 0 4px}
.cele{position:relative;height:0}
.cele i{position:absolute;top:0;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 1.3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-10px) rotate(0)}100%{opacity:0;transform:translateY(120px) rotate(320deg)}}
.player{margin-top:14px}
.player audio{width:100%}
.steps{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:2px 12px;align-items:start;border:1.5px solid var(--line);border-radius:22px;padding:14px}
.steps li.cur{border-color:var(--accent);background:linear-gradient(var(--soft),#fff 70%)}
.steps li.ok{opacity:.65}
.steps .n{grid-row:1/3;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--round);font-weight:900;font-size:16px}
.steps li.cur .n{background:var(--accent)}
.steps li.ok .n{background:var(--ok)}
.steps h3{margin:5px 0 0;font-family:var(--round);font-size:17px}
.steps .body{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14.5px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.path span{background:var(--surface);border-radius:8px;padding:2px 9px;font-weight:700;font-size:13px}
.path i{font-style:normal;color:var(--muted)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details.review{margin-top:16px;border:1.5px solid var(--line);border-radius:18px;padding:12px 16px}
details.review summary{cursor:pointer;font-weight:700}
.alist{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.aitem{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.aitem .badge{font-family:var(--round);font-weight:900;width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.aitem .q{font-weight:700;font-size:14px}
.aitem .q small{color:var(--muted);font-weight:400;margin-left:6px}
.again{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
/* 記録 */
.log{display:flex;flex-direction:column;gap:8px}
.logi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:18px;padding:10px 14px}
.logi .d{font-family:var(--round);font-weight:900;text-align:center;line-height:1.15}
.logi .d b{display:block;font-size:22px}
.logi .d span{font-size:11.5px;color:var(--muted)}
.logi .t{font-size:14px}
.logi .t small{display:block;color:var(--muted);font-size:12.5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.week div{text-align:center;font-size:11.5px;color:var(--muted)}
.week i{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface);margin-bottom:3px}
.week i.on{background:var(--accent)}
.week i.today{outline:2px solid var(--accent);outline-offset:-2px}
.empty{background:var(--surface);border-radius:20px;padding:22px;text-align:center;color:var(--muted);font-size:14.5px}
/* 質問リスト */
.ltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ltools .count2{margin-left:auto;font-size:13px;color:var(--muted)}
.lgroup{margin-top:20px}
.lgroup h3{font-family:var(--round);font-size:15px;margin:0 0 6px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 2px;border-top:1px solid var(--line)}
.qitem .badge{font-family:var(--round);font-weight:900;width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:15px}
.qitem.sel .badge{background:var(--accent);color:#fff}
.qitem .t{padding-top:4px;font-size:15px}
.star{color:#b5610b;font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.qitem input{width:22px;height:22px;accent-color:var(--accent);margin-top:6px;cursor:pointer}
.qitem details{grid-column:2/4;font-size:13.5px;color:var(--muted)}
.qitem summary{cursor:pointer;width:max-content}
.qitem details p{margin:4px 0 0}
.lfoot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:18px}
/* 先生用（手入力） */
.card{border:1.5px solid var(--line);border-radius:22px;padding:18px 16px}
.mh2{font-family:var(--round);font-weight:900;font-size:20px;margin:0}
.mh3{font-family:var(--round);font-size:16px;margin:22px 0 8px}
.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.moregrid .wide{grid-column:1/-1}
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead .btn{padding:4px 10px;font-size:13px}
.mrow select,.mrow input,.mrow textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;width:100%;font-size:15px}
.mgrid{display:grid;grid-template-columns:130px 1fr;gap:10px}
.mgrid .field{margin-top:0}
@media (max-width:420px){.mgrid,.moregrid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="ttl"></h1>
  </header>
  <main>
    <section id="vPractice"></section>
    <section id="vList" hidden></section>
    <section id="vLog" hidden></section>
    <section id="vManual" hidden></section>
  </main>
</div>

<script>
const UNIV=`立教大学 経済学部 会計ファイナンス学科（2027年度入試）
- 入試方式：自由選抜入試（経済学部3学科（経済学科・経済政策学科・会計ファイナンス学科）で約20名、専願）。英語の外部試験スコアが出願条件とされる（基準は入試要項で確認）。
- 1次選考：書類審査。志望理由書（約2,000字・手書き。これまでの実績や集中して取り組んできたことと、入学後に何をどのように学びたいか）、調査書、英語資格の証明書など。
- 2次選考：総合科目（現代の政治・経済への知識と関心、基礎的な数学的分析力を問う記述式。課題文や図表を読む）と、個人面接（約15分。志望理由、入学後の具体的な計画、高校時代の活動などを深く聞かれる）。

# この受験生の志望理由書の要点（面接ではこの内容を深掘りされる。答えとの一貫性も評価する）
- きっかけ：高校在学中のフィリピン・マニラでの8週間の語学留学で、高層ビル群のすぐ隣に貧困地区がある対比を見て、経済格差の根底に「お金の循環」の構造的な問題があると考えた。
- その後、自ら志願してカンボジアの現地研修に参加。設備のない学校で学ぶ子どもたちの夢と、リサイクル品で学校を建てるなど工夫して生きる人々に出会い、一過性の寄付やボランティアではなく、現地の人が主体的に豊かになる「持続可能な経済的仕組み」が必要だと考えた。
- 実践：現地の起業家の協力を得て、カンボジアの学校や農家が生産に関わるフェアトレードのハーブティーを日本で販売し、利益を現地の教育環境に還元するプロジェクトを個人で立ち上げた。ストーリーだけでは売れず、自分でパッケージをデザインしたオリジナル商品を開発。試飲、チラシ、SNS、価格設定、会計まで一人で担った。食品表示法などを独学したが、書類不備で輸入が進まず、空港の税関にも出向いた。仕入れ・価格・利益・寄付の割合を感覚で決める限界を感じ、会計とファイナンスの知識の必要性を痛感した。
- 将来：社会課題を解決する経営者。住環境・空間プロデュースを中心とした環境デザイン会社を起業し、適切な利益と従業員への還元を両立する健全な経営をしたい。海外とも協働したい。
- 本学科を選んだ理由（本人の記述）：経済学の基礎の上に会計・ファイナンス・マネジメントを横断して学べる。1年次の少人数「プロセミナール」、2年次からの「ビジネス・リーダーシップ・プログラム」、英語で学ぶ「International Program for Business」に挑戦したい。※ビジネス・リーダーシップ・プログラムは経営学部のプログラムであり、ほかの2つも経済学部の制度名として確認できていない。面接でこれらを説明できるか、経済学部の実際の学び（基礎ゼミナール、課題解決演習、英語による経済科目、短期留学など）を正しく理解しているかを確かめ、誤りがあれば具体的に指摘する。
- 協働の経験：マニラで多様な国籍の仲間とグループワークに取り組み、相手の文化や立場を尊重して聞いたうえで自分の考えを論理的に伝え、役割分担を提案して合意形成に努めた。`;

function planRandom(total){

  out.push(...deep.slice(0,Math.max(1,Math.round((total-2)*0.45))));
  const pool={}; mids.forEach(q=>{ if(q.g===D||out.includes(q.n)) return; (pool[q.g]=pool[q.g]||[]).push(q.n); });
  for(const k in pool) pool[k]=shuffle(pool[k]);
  for(const g of CFG.order){ if(out.length>=total-2) break; const n=pool[g]&&pool[g].shift(); if(n) out.push(n); }

${M?"先生が面接官となって行った面接練習":"受験生がひとりで行った面接練習"}について、受験生本人に渡すフィードバックを作ってください。${A?"\nこのメッセージには、受験生の答えを録音した音声ファイルが1つ添付されています。音声ファイルが添付されていない、または再生できない場合は、PDFを作らずに「録音の音声ファイルを添付して、もう一度送ってください。」とだけ返答してください。":""}

${UNIV}

- 練習回：${RD||"（未記入）"}
- ${CFG.themeLabel}：${TH||"（未記入）"}

# 練習の方法
${M?"先生が面接官となり、対面で質問した。「答え」は、受験生の答えを先生が聞き取って入力したメモで、要点だけの場合がある。メモの言葉づかいや文の短さは受験生の評価に含めない。「面接官の気づき」は、その質問への答え方について先生が気づいたこと。"+(timed.length?"回答時間は先生が測った秒数（記入がある質問のみ）。":""):"練習ページの擬似面接官（合成音声）が質問を読み上げ、受験生が声で答えた。添付の音声ファイルには、受験生の答えだけが順番に録音されている（質問の読み上げは入っていない。答えと答えの間に約0.8秒の無音がある）。下の「質問と録音の位置」を手がかりに、どの答えがどの質問へのものかを対応させること。まず音声を最後までよく聞いて、それぞれの答えの内容を正確に把握してから評価すること。聞き取れない部分は推測で補わず、聞き取れなかったと扱う。「深掘り」は、直前の質問への答えを受けて面接官が続けて聞いた問い。"}

${crit}

# 書き方の注意
- 答えにないことを推測で事実のように書かない。答えた質問が少なく判断できない観点は、そう述べて点数を控えめにする。
- 受験生本人に「あなた」と語りかける、前向きで具体的な文体。抽象的な励ましだけにしない。

${M?"- 話し方や態度（声、目線、姿勢、話す速さなど）は、面接官の気づきに書かれていることだけをもとに述べる。書かれていないことは推測しない。"+(timed.length?"\n- 回答時間が90秒を超える答えには、短くする助言を入れる。":""):"- 回答時間が90秒を超える答えには、短くする助言を入れる。"+(A?"話し方（声の大きさ・話す速さ・「えー」「あの」などの言いよどみ・沈黙）は音声から判断してよい。表情や姿勢は判断しない。":"声の調子や表情は判断しない。")}

# 出力のしかた（とても大事）
内容を考えたら、下の「レイアウト指定」どおりのA4縦1枚のPDFファイルを作成し、ダウンロードできる形で出力してください。画面上の文章やCanvasではなく、必ずPDFファイルとして出力してください。

## 作り方のルール
- A4縦（210×297mm）1枚。余白は上下左右12mm。2枚目にはみ出したら、字数を削って必ず1枚に収める。
- 日本語フォント（Noto Sans JP など）を本文・表・グラフのラベルすべてに指定する。★☆◎▲などの記号や絵文字は文字化けしやすいので使わない（点数は数字と棒・塗りつぶした図形で表す）。
- 文字が枠や表のセルからはみ出したり、他の要素と重なったりしないこと。表は列幅を固定し、セル内で折り返す。
- 文字の大きさ：タイトル16pt、見出し11pt、本文8.5〜9pt（7.5pt未満にはしない）。
- 色：基調は深緑（#2C6A57）、薄い緑（#E2EFE9）、改善点と注意だけオレンジ（#B4641E／薄いオレンジ #FBEFE2）、文字は濃いグレー。背景は白。
- グラフは日本語ラベルが文字化けしないように作り、PDFに図として配置する。
- 出力する前に、出来上がりを確認する：1枚に収まっているか、文字化け・重なり・切れがないか。問題があれば直してから出力する。
- 答えの全文は載せない。（ ）内は書き方の指示なので、PDFには残さない。
- ファイル名は「面接フィードバック_${RD||"1回目"}_${d.getMonth()+1}月${d.getDate()}日.pdf」。

## レイアウト指定（上から順に。「左｜右」は2列に並べる）
1. ヘッダー（深緑の帯・白文字）
   左：「面接練習フィードバック」（タイトル）、その下に小さく「${CFG.school}｜${CFG.exam}」
   右：「練習回：${RD||"1回目"}」「実施日：${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日」

2. 総合評価（薄い緑の角丸の枠）
   左：A・B・C・Dの1文字を直径25mmほどの円の中に大きく（40pt前後）。円の下に、Aなら「合格圏」、Bなら「あと一歩」、Cなら「要強化」、Dなら「基礎から」
   右：見出し「総評」と、総評（100字以内）

3. 観点別の評価
   左：レーダーチャート（5角形、約65mm四方）。軸は下の5つの観点（短い名前で可）、目盛りは1〜5点。塗りは薄い緑、線は深緑。各頂点の近くに点数の数字。
   右：表「観点｜点数｜ひとこと」。点数は「4／5」のような数字の横に、5マスのうち点数分を深緑で塗った横棒を添える。ひとことは30字以内。

4. 良かった点｜改善点と次の行動
   左（薄い緑の枠、見出し「良かった点」）：3つまで、各40字以内の箇条書き
   右（薄いオレンジの枠、見出し「改善点 → 次の行動」）：3つまで。各項目は太字の改善点（20字以内）と、その下に「→」で次の行動（40字以内）

5. 質問ごとのアドバイス（見出しの左に深緑の縦線）
   改善が必要な順に4問まで、2列×2段のカード（細い罫線の角丸）。各カード：
   - 1行目（太字）：「◯番」と質問の要約（25字以内）
   - 「直す点」の小さなオレンジのラベル＋35字以内
   - 薄いグレーの帯で「改善例」＋本人の答えを活かした骨子（70字以内）

${chart?`6. 回答の長さ｜本番に向けて
   左：横棒グラフ「回答の長さ（目安30〜60秒）」。縦に質問番号、横軸は0〜120秒。30〜60秒の範囲を薄い緑の帯で示し、棒は深緑、90秒を超える棒だけオレンジ。棒の右端に秒数。90秒を超える答えがあれば、グラフの下に一言（30字以内）。`:`6. 話し方・態度｜本番に向けて

/* ---------- 手入力でFB（先生が面接官のとき） ---------- */
const todayStr=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

  const items=m.rows.map(r=>{ const q=r.n==="0"?r.q.trim():(r.n?QS[+r.n-1].q:""); return {label:r.n&&r.n!=="0"?`${r.n}番`:"追加の質問",q,a:r.a.trim(),sec:Math.round(Number(String(r.sec).replace(/[^0-9.]/g,""))||0),note:r.note.trim()}; }).filter(x=>x.q&&x.a);

      const free=inp("q",{type:"text",placeholder:"質問を入力（深掘りの質問など）"},r); free.hidden=r.n!=="0";
      sel.addEventListener("change",()=>{ r.n=sel.value; free.hidden=r.n!=="0"; save(); });

          el("label",{class:"field"},el("span",{text:"回答時間（秒・任意）"}),inp("sec",{type:"text",inputmode:"numeric",placeholder:"例：60"},r)),
          el("label",{class:"field"},el("span",{text:"面接官の気づき（任意）"}),inp("note",{tag:"textarea",rows:"2",placeholder:"例：結論が後回し。深掘りで具体例が出なかった。"},r)))));
    }); };

    el("p",{class:"small",style:"margin:4px 0 0",text:"先生が面接官になって練習したときに使います。聞いた質問を選び、答えの要点を入力すると、Geminiへの依頼文ができます。入力した内容はこの端末に保存されます。"}),
    el("div",{class:"moregrid",style:"margin-top:16px"},

      el("label",{class:"field"},el("span",{text:"実施日"}),inp("date",{type:"date"})),
      el("label",{class:"field wide"},el("span",{text:CFG.themeLabel+"（任意）"}),inp("theme",{tag:"textarea",rows:"2",placeholder:CFG.themePH}))),
    el("h3",{class:"mh3",text:"質問と答え"}),

    el("button",{class:"btn",type:"button",style:"margin-top:10px",onclick:()=>{ m.rows.push(newRow()); save(); drawRows(); rowsBox.lastChild.querySelector("select").focus(); }},"＋ 質問を追加"),
